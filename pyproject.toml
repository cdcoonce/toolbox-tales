[project]
name = "toolbox-tales"
version = "0.1.0"
description = "Toolbox Tales episode pipeline"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "edge-tts>=7"]

[project.scripts]
toolbox-tales = "toolbox_tales.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolbox_tales"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
